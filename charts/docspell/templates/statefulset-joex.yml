apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "docspell.fullname" . }}-joex
  labels:
    {{- include "docspell.labels" . | nindent 4 }}
    docspell-component: joex
spec:
  replicas: {{ .Values.joex.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "docspell.selectorLabels" . | nindent 6 }}
      docspell-component: joex
  serviceName: docspell-joex
  template:
    metadata:
      annotations:
        secret-hash: {{ include (print $.Template.BasePath "/secret-joex.yml") $ | sha256sum }}
        config-hash: {{ include (print $.Template.BasePath "/configmap-joex.yml") $ | sha256sum }}
      labels:
        {{- include "docspell.selectorLabels" . | nindent 8 }}
        docspell-component: joex
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: joex
        image: {{ print .Values.joex.image.repo ":" (.Values.joex.image.tag | default .Values.image.tag | default (print "v" .Chart.AppVersion)) | quote }}
        imagePullPolicy: {{ .Values.joex.image.pullPolicy | default .Values.image.pullPolicy | quote }}
        command: ['/custom-entrypoint.sh']
        args:
        {{- range .Values.joex.jvmOptions }}
        - {{ . | quote }}
        {{- end }}
        - '--'
        - '/opt/docspell.conf'
        env:
        {{- include "docspell.configVariables" (dict "Sources" (list .Values.configVariables .Values.joex.configVariables) "Root" $) | nindent 8 }}
        ports:
        - name: api
          containerPort: 7878
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /opt/docspell.conf
          subPath: config
        - name: configmap
          mountPath: /custom-entrypoint.sh
          subPath: entrypoint.sh
          readOnly: true
        resources:
          {{- toYaml .Values.joex.resources | nindent 12 }}
      {{- if .Values.joex.unoserver.enabled }}
      - name: unoserver
        image: {{ print .Values.joex.unoserver.image.repo ":" (.Values.joex.unoserver.image.tag | default "latest") | quote }}
        imagePullPolicy: {{ .Values.joex.unoserver.image.pullPolicy | quote }}
        ports:
        - name: unoserver
          containerPort: {{ .Values.joex.unoserver.port | default 2003 }}
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - unoping
            - --host
            - 127.0.0.1
            - --port
            - {{ .Values.joex.unoserver.port | default 2003 | quote }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - unoping
            - --host
            - 127.0.0.1
            - --port
            - {{ .Values.joex.unoserver.port | default 2003 | quote }}
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        {{- with .Values.joex.unoserver.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
      volumes:
      - name: config
        secret:
          secretName: {{ include "docspell.fullname" . }}-joex-config
      - name: configmap
        configMap:
          name: {{ include "docspell.fullname" . }}-joex-configmap
          defaultMode: 0755
